<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="32" cy="32" r="28" fill="#0f172a" stroke="url(#grad)" stroke-width="2.5" />
  <!-- Globe lines -->
  <ellipse cx="32" cy="32" rx="14" ry="26" stroke="#6366f1" stroke-width="1.8" opacity="0.6" />
  <line x1="6" y1="32" x2="58" y2="32" stroke="#6366f1" stroke-width="1.8" opacity="0.6" />
  <line x1="12" y1="20" x2="52" y2="20" stroke="#6366f1" stroke-width="1.2" opacity="0.4" />
  <line x1="12" y1="44" x2="52" y2="44" stroke="#6366f1" stroke-width="1.2" opacity="0.4" />
  <!-- Neural / Spark Core -->
  <circle cx="32" cy="32" r="7" fill="url(#grad)" filter="url(#glow)" />
  <circle cx="32" cy="32" r="3.5" fill="#ffffff" />
  <circle cx="22" cy="24" r="2" fill="#38bdf8" />
  <circle cx="42" cy="24" r="2" fill="#a855f7" />
  <circle cx="24" cy="40" r="2" fill="#38bdf8" />
  <circle cx="40" cy="40" r="2" fill="#a855f7" />
  <line x1="22" y1="24" x2="32" y2="32" stroke="#38bdf8" stroke-width="1.2" opacity="0.8" />
  <line x1="42" y1="24" x2="32" y2="32" stroke="#a855f7" stroke-width="1.2" opacity="0.8" />
  <line x1="24" y1="40" x2="32" y2="32" stroke="#38bdf8" stroke-width="1.2" opacity="0.8" />
  <line x1="40" y1="40" x2="32" y2="32" stroke="#a855f7" stroke-width="1.2" opacity="0.8" />
</svg>
